<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eavesdrop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind via CDN, shared colors and font in resources/tailwind-config.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="resources/tailwind-config.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-ink font-sans text-white lowercase antialiased">
    <script src="resources/nav.js"></script>

    <main class="flex-1 pt-20">
        <section>
            <div class="mx-auto max-w-3xl px-6 py-24 text-center sm:py-36">
                <h1 class="animate-fade-up bg-gradient-to-r from-accent to-emerald-300 bg-clip-text pb-2 text-5xl font-medium tracking-tight text-transparent sm:text-7xl">welcome to eavesdrop</h1>
                <p class="animate-fade-up mx-auto mt-7 max-w-xl text-lg text-mist [animation-delay:150ms] sm:text-xl">share your sound and discover that of others.</p>

                <div class="animate-fade-up mt-12 flex flex-wrap items-center justify-center gap-4 [animation-delay:300ms]">
                    <a href="https://apps.apple.com/us/iphone/search?term=eavesdrop" class="rounded-xl transition duration-300 hover:-translate-y-1 hover:shadow-glow"><img src="resources/getOnAppStore.png" alt="Download on iOS" class="h-14 w-auto"></a>
                    <a href="https://play.google.com/store/search?q=eavesdrop&c=apps&utm_source=emea_Med" class="rounded-xl transition duration-300 hover:-translate-y-1 hover:shadow-glow"><img src="resources/getOnGooglePlay.png" alt="Download on Google Play" class="h-14 w-auto"></a>
                </div>
            </div>
        </section>

        <!-- No box: the text sits directly on the page, under a thin line of light -->
        <section class="animate-fade-up relative isolate mx-auto max-w-2xl px-6 pb-28 text-center [animation-delay:450ms]">
            <h2 class="text-2xl font-medium text-white sm:text-3xl">about eavesdrop</h2>
            <p class="mt-5 text-lg leading-8 text-mist">eavesdrop is real-time (music) sharing platform. see what people around you and your friends are listening to.</p>
        </section>
    </main>

    <script src="resources/footer.js"></script>
</body>
</html>
