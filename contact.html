<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact – eavesdrop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind via CDN, shared colors and font in resources/tailwind-config.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="resources/tailwind-config.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-ink font-sans text-white lowercase antialiased">
    <script src="resources/nav.js"></script>

    <main class="flex-1 pt-20">
        <!-- No box: everything sits directly on the page -->
        <section class="mx-auto max-w-2xl px-6 py-24 text-center sm:py-32">
            <h1 class="animate-fade-up bg-gradient-to-r from-accent to-emerald-300 bg-clip-text pb-2 text-4xl font-medium tracking-tight text-transparent sm:text-6xl">contact us</h1>

            <div class="animate-fade-up mt-10 [animation-delay:150ms]">
                <p class="text-lg leading-8 text-mist">we’re here to help. if you have questions, concerns, or feedback, feel free to reach out anytime.</p>
                <p class="mt-4 text-lg leading-8 text-mist">all song of the day requests will be ignored.</p>

                <a href="mailto:eavesdrop.customer.service@gmail.com" class="group mt-10 inline-flex items-center gap-3 break-all text-base text-accent transition duration-300 hover:text-white sm:text-lg">
                    <svg class="h-6 w-6 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="5" width="18" height="14" rx="2"/>
                        <path d="m3 7 9 6 9-6"/>
                    </svg>
                    <span class="underline-offset-4 group-hover:underline">eavesdrop.customer.service@gmail.com</span>
                </a>
            </div>
        </section>
    </main>

    <script src="resources/footer.js"></script>
</body>
</html>
